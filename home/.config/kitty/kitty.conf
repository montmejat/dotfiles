# Light/dark follows the system: kitty loads light-theme.auto.conf or
# dark-theme.auto.conf (Adwaita light / Adwaita dark) automatically.
# GNOME's "Light" reports no preference rather than light, so
# no-preference-theme.auto.conf is a copy of the light theme.
# Browse other themes with: kitten themes

window_padding_width 8

# One layout: free-form splits, like Ghostty
enabled_layouts splits

# vim-inspired split controls: Ctrl+Alt+hjkl creates a split in that
# direction, Shift+Alt+hjkl moves focus to the split in that direction
map ctrl+alt+l launch --location=vsplit --cwd=current
map ctrl+alt+j launch --location=hsplit --cwd=current
map ctrl+alt+h combine : launch --location=vsplit --cwd=current : move_window left
map ctrl+alt+k combine : launch --location=hsplit --cwd=current : move_window up
map shift+alt+h neighboring_window left
map shift+alt+j neighboring_window down
map shift+alt+k neighboring_window up
map shift+alt+l neighboring_window right

# Scrollback "normal mode": opens the scrollback in a pager
# (j/k, d/u, f/b, g/G, / to search, q to exit)
map shift+alt+n show_scrollback

# Jump between shell prompts (needs kitty's shell integration, on by default)
map shift+alt+[ scroll_to_prompt -1
map shift+alt+] scroll_to_prompt 1
